<!-- Página simples com cabeçalho, 3 seções responsivas com transformações (escala, rotação, transição) e um botão animado -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="m-5">
    <header class="bg-pink-200 p-30"> Cabeçalho</header>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 mt-20 h-90">
        <!-- seção padrão: 1 coluna, tela média: 2 colunas, tela xl: 3 colunas -->
        
        <div class="bg-amber-400 animate-pulse"> Olá </div>
        <div class="bg-emerald-400 animate-pulse"> Texto </div>
        <div class="bg-lime-400 animate-pulse"> Aqui</div>

    </div>
    
</body>
</html>
