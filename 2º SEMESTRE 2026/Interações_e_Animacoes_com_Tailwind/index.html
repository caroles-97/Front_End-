        <!-- Animação em CSS com Tailwind -->
        <style type="text/tailwindcss">
            @layer utilities { /*vamos usar uma camada de utilidades*/
                @keyframes fade { /*@keyframes: CSS, determina a passagem de tempo da animação, personalizar as animações*/
                    0% {opacity: 0;}
                    100% {opacity:1;}
                }
                @keyframes wiggle {
                    0%, 100% { transform: rotate(-3deg); }
                    50% {transform: rotate(3deg);}
                }
                .animate-fadeCaroles {
                    animation: fade 1s ease-in-out infinite;
                }
                .animate-wiggle {
                    animation: wiggle 0.5s ease-in-out infinite;
                }
            }

        </style>
</head>
<body class="m-4">
    <button class="bg-blue-500 hover:bg-blue-700 focus:ring-4 active:bg-blue-900 text-white font-bold py-2 px-4 rounded"> 
        Interaja comigo
    </button>

    
    <div class="group p-4 bg-gray-100 hover:bg-gray-200 rounded-lg mt-4 max-w-md">
        <!-- group ordena o 'resto'. Colocando larguda máxima 'médio' -->
        <h2 class="group-hover:text-blue-500 text-lg font-bold">
            Título
        </h2>
        <p class="group-hover:underline">
            Texto ao passar o mouse
        </p>

    </div>  
    
    <div class="mt-4">
        <input type="checkbox" id="mostrar" class="peer hidden">
        <!-- input é a caixinha. Para ela não aparecer, usamos 'peer hidden'. Peer é um "par", tem funcionalidade como se fosse o "group" mas somente para 2-->

        <label for="mostrar" class="cursor-pointer text-pink-600">
            <!-- cursor - pointer: muda o cursor -->
            Mostrar mensagem
        </label>
        <!-- label é associada a mensagem do input -->
        <!-- for usado p associar a msg ao input - PORTANTO PRECISA SER O MESMO ID do Input -->

        <div class="mt-2 hidden peer-checked:block text-yellow-400">Checkbox marcado!☆*: .｡. o(≧▽≦)o .｡.:*☆ 🎉✨✨</div>
        <!-- Windowns + . para abrir os emojis -->
        <!-- Quando o par dele estiver marcado, a div dele aparece (block - aparece).-->
    </div>

    <button class="bg-red-500 hover:bg-red-700 text-white py-2 px-4 rounded transition duration-500 ease-in-out">
        Clique Suave - Aula 10/1/26
        transition duration-500 ease-in-out - Para transicionar a cor
    </button>

    <div class="w-10 h-10 bg-blue-500 rounded-full animate-bounce mt-8">

    </div>
    <div class="w-10 h-10 bg-blue-500 rounded-full animate-spin mt-8">
        G
    </div>

    <div class="w-10 h-10 bg-blue-500 rounded-full animate-pulse mt-8">
        G
    </div>

    <div class="w-10 h-10 bg-blue-500 rounded-full animate-ping mt-8">
        G
    </div>


<!-- Animações 1/10/26 -->
    <div class="p-4 bg-green-300 rounded w-20 animate-fade">

    <button class="animate-wiggle mt-4">Treme</button>
    <div class="animate-wiggle w-40 h-40 bg-amber-500 rounded mt-4"> Treme</div>
    <div class="animate-fade w-40 h-40 bg-pink-400 rounded-full mt-4"> Animação Fade </div>




</body>
